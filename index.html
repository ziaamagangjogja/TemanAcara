  <body>
    <div id="root"></div>

    <!-- Pemuat font opsional. Jika Google Fonts tidak dapat dijangkau
         (jaringan lambat / diblokir), aplikasi TETAP tampil memakai font
         sistem. Font TIDAK PERNAH menahan render. -->
    <script>
      (function () {
        try {
          var l1 = document.createElement('link');
          l1.rel = 'preconnect';
          l1.href = 'https://fonts.googleapis.com';
          document.head.appendChild(l1);

          var l2 = document.createElement('link');
          l2.rel = 'preconnect';
          l2.href = 'https://fonts.gstatic.com';
          l2.crossOrigin = 'anonymous';
          document.head.appendChild(l2);

          var font = document.createElement('link');
          font.rel = 'stylesheet';
          font.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap';
          font.media = 'print';
          font.onload = function () { font.media = 'all'; };
          document.head.appendChild(font);
        } catch (e) {
          /* abaikan: aplikasi pakai font sistem */
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
